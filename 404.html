<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>페이지를 찾을 수 없습니다</title>
<script>
/* GitHub Pages 는 없는 주소에 이 파일을 보여 준다.
   빌드 뒤에 새로 생긴 숏컷 링크(/go/<앵커>)는 아직 정적 HTML 이 없으므로
   /go/?<앵커> 로 돌려보내 화면(GoView)이 최신 발행본에서 찾게 한다.
   (사이트 기준 경로는 주소에서 '/go/' 앞부분으로 안다) */
(function () {
  var m = location.pathname.match(/^(.*\/)go\/([a-zA-Z0-9]+)\/?$/)
  if (m) location.replace(m[1] + 'go/?' + m[2].toLowerCase())
})()
</script>
<style>
  body { font-family: system-ui, sans-serif; color: #4a3b32; background: #fff; margin: 0; padding: 60px 16px; text-align: center; }
  a { color: #e07b39; }
</style>
</head>
<body>
<h1 style="font-size:20px">페이지를 찾을 수 없습니다</h1>
<p><a id="home" href="/">가이드 처음으로</a></p>
<script>
  // 프로젝트 사이트(…/tutoring-guide/)면 첫 경로 조각이 사이트 기준 경로다
  var seg = location.pathname.split('/')[1]
  if (seg) document.getElementById('home').href = '/' + seg + '/'
</script>
</body>
</html>
